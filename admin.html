<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin Panel | The Chosen One</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFF8E6; --ink: #1A1408; --card: #FFFFFF; --gold: #F5B700; --on-gold: #1A1408;
      --line: #E8D9A8; --muted: #6B5F3E; --hero: #141008; --hero-ink: #FFC21A; --ok: #1F7A3A; --bad: #B3261E;
      --display: 'Anton', Impact, sans-serif; --body: 'Barlow', system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141008; --ink: #FFF3CF; --card: #1F1A0E; --gold: #FFC21A; --line: #3A3018; --muted: #BFAF80; --hero: #0B0904; --ok: #6FD08C; --bad: #FF8A80; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
    header { background: var(--hero); color: var(--hero-ink); padding: 26px 0 22px; }
    header h1 { font-family: var(--display); font-size: clamp(34px, 9vw, 52px); margin: 0; }
    header p { margin: 6px 0 0; opacity: 0.85; }
    .stats { display: flex; gap: 10px; margin: 16px 0; }
    .stat { flex: 1; background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; }
    .stat b { font-family: var(--display); font-size: 30px; display: block; }
    .stat span { color: var(--muted); font-size: 14px; }
    .box { background: var(--card); border: 2px solid var(--ink); border-radius: 16px; padding: 14px; margin-bottom: 16px; }
    h2 { font-family: var(--display); font-size: 24px; margin: 0 0 10px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 480px) { .fields { grid-template-columns: 1fr; } }
    label { display: block; font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    input { width: 100%; font: inherit; padding: 11px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
    button, .btn { font: inherit; font-weight: 700; border: 2px solid var(--ink); background: var(--gold); color: var(--on-gold); border-radius: 12px; padding: 10px 14px; cursor: pointer; min-height: 46px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    button.alt, .btn.alt { background: var(--card); color: var(--ink); }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .full { width: 100%; margin-top: 12px; }
    .msg { min-height: 1.4em; margin: 8px 0 12px; font-weight: 700; }
    .cust { background: var(--card); border: 2px solid var(--ink); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
    .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .top b { font-size: 20px; }
    .top span { color: var(--muted); }
    .dots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin: 10px 0; }
    .dot { aspect-ratio: 1; border-radius: 50%; border: 2px dashed var(--muted); display: grid; place-items: center; font-size: 12px; }
    .dot.on { background: var(--gold); border: 2px solid var(--ink); }
    .dot.r { border-style: solid; border-color: var(--ink); }
    .state { font-weight: 700; margin: 0 0 10px; }
    .state.ready { color: var(--ok); }
    .acts { display: flex; flex-wrap: wrap; gap: 8px; }
    .acts button, .acts .btn { flex: 1 1 140px; }
    .small { font-size: 14px; min-height: 38px; padding: 6px 10px; font-weight: 600; }
    .edit-phone-box { display: flex; gap: 6px; margin-top: 8px; }
    .edit-phone-box input { flex: 1; padding: 6px 10px; font-size: 14px; }
    .empty { background: var(--card); border: 2px dashed var(--muted); border-radius: 16px; padding: 20px; text-align: center; }
    .rep-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .rep-head input[type="date"] { width: auto; padding: 6px 10px; font-size: 15px; }
    .rep-list { font-size: 15px; line-height: 1.5; margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
    .rep-list p { margin: 4px 0; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>👑 Panel Administrador</h1>
      <p>Tus clientes y sus sellos</p>
    </div>
  </header>

  <main class="wrap">
    <div id="app">
      <div class="stats">
        <div class="stat"><b id="sClients">0</b><span>Clientes totales</span></div>
        <div class="stat"><b id="sReady">0</b><span>Premios por canjear</span></div>
      </div>

      <!-- SECCIÓN DE REPORTE DIARIO -->
      <div class="box">
        <div class="rep-head">
          <h2 style="margin:0">📊 Reporte Diario</h2>
          <input type="date" id="repDate">
        </div>
        <div class="stats" style="margin: 8px 0;">
          <div class="stat" style="padding: 8px 10px;"><b id="rStamps" style="font-size:24px;">0</b><span>Sellos del día</span></div>
          <div class="stat" style="padding: 8px 10px;"><b id="rNew" style="font-size:24px;">0</b><span>Clientes nuevos</span></div>
        </div>
        <div class="rep-list" id="repDetails"></div>
        <button id="copyRep" type="button" class="alt small full" style="margin-top:10px;">📋 Copiar resumen del día</button>
      </div>

      <!-- AGREGAR CLIENTE -->
      <div class="box">
        <h2>Agregar cliente</h2>
        <div class="fields">
          <div><label for="fn">Nombre</label><input id="fn" type="text" maxlength="40" autocomplete="off"></div>
          <div><label for="fp">Celular (opcional)</label><input id="fp" type="tel" inputmode="numeric" maxlength="15" autocomplete="off"></div>
        </div>
        <button id="add" type="button" class="full">Agregar cliente</button>
      </div>

      <p class="msg" id="msg" role="status" aria-live="polite"></p>

      <label for="q">Buscar cliente</label>
      <input id="q" type="text" placeholder="Nombre o celular" autocomplete="off" style="margin-bottom:14px">
      <div id="list"></div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="admin.js"></script>
</body>
</html>
